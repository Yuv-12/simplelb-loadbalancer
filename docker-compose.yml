version: "3.8"

services:
  lb-cpp:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    container_name: lb-cpp
    ports:
      - "3030:3030"
    command: --backends "http://web1:80,http://web2:80,http://web3:80" --port 3030
    depends_on:
      - web1
      - web2
      - web3

  lb-python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: lb-python
    ports:
      - "3031:3031"
    command: --backends "http://web1:80,http://web2:80,http://web3:80" --port 3031
    depends_on:
      - web1
      - web2
      - web3

  lb-go:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: lb-go
    ports:
      - "3032:3032"
    command: --backends "http://web1:80,http://web2:80,http://web3:80" --port 3032
    depends_on:
      - web1
      - web2
      - web3

  web1:
    image: strm/helloworld-http
    container_name: web1

  web2:
    image: strm/helloworld-http
    container_name: web2

  web3:
    image: strm/helloworld-http
    container_name: web3
